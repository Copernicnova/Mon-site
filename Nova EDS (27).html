function seed(){
  const out=[];let id=1;
  CC0.map(c=>({c:c.code})).forEach((f,fi)=>{
    [6,7].forEach(cl=>{
      const list=SEEDACC.filter(c=>c.cl===cl);
      const raw=list.map((c,ai)=>c.w*(1+(((fi*3+ai)%5)-2)*0.03));
      const sum=raw.reduce((a,b)=>a+b,0);
      let left=TOT[f.c][cl];
      list.forEach((c,ai)=>{
        const tot=ai===list.length-1?left:Math.round(TOT[f.c][cl]*raw[ai]/sum);
        left-=tot;
        const wr=[];let sw=0;
        for(let m=1;m<=6;m++){const w=SEAS[m-1]*(1+(((ai*5+m*3+fi)%7)-3)*0.015);wr.push(w);sw+=w}
        let rest=tot;
        for(let m=1;m<=6;m++){const v=m===6?rest:Math.round(tot*wr[m-1]/sw);rest-=v;out.push({id:id++,date:eom(m),f:f.c,k:c.k,lib:c.l,s:'rea',m:v})}
        const B=Math.round(tot*2*(1+(((ai*3+fi*2)%7)-2)*0.025)),sb=SEAS.reduce((a,b)=>a+b,0);
        let rb=B;
        for(let m=1;m<=12;m++){const v=m===12?rb:Math.round(B*SEAS[m-1]/sb);rb-=v;out.push({id:id++,date:eom(m),f:f.c,k:c.k,lib:c.l,s:'bud',m:v})}
        const fac=cl===6?0.955+((ai+fi)%4)*0.012:0.975+((ai*2+fi)%4)*0.01,E=Math.round(B*fac);
        let re=E;
        for(let m=1;m<=12;m++){const v=m===12?re:Math.round(E*SEAS[m-1]/sb);re-=v;out.push({id:id++,date:eom(m),f:f.c,k:c.k,lib:c.l,s:'exe',m:v})}
      });
    });
  });
  return out;
}

function projLines(D){
  const act={};
  const M=+S.arr,out=[];let id=-1;
  live().forEach(l=>{if(l.s==='rea'&&(!l.j||S.jr)){const mm=l.j?Math.min(+l.date.slice(5,7),M):+l.date.slice(5,7),key=l.f+'|'+l.k;(act[key]=act[key]||Array(13).fill(0))[mm]+=l.m}});
  FIL.forEach(f=>ACC(6).concat(ACC(7)).forEach(c=>{
    const a=act[f.c+'|'+c.k]||Array(13).fill(0);
    const cumTo=n=>{let s=0;for(let m=1;m<=n;m++)s+=a[m];return s};
    const run=n=>{const k=Math.min(3,n);let s=0;for(let m=n-k+1;m<=n;m++)s+=a[m];return k?s/k:0};
    let tot;
    tot=D<=M?cumTo(D):cumTo(M)+run(M)*(D-M);
    out.push({id:id--,date:eom(D),f:f.c,k:c.k,lib:'Projection au '+fdate(D),s:'prev',m:Math.round(tot)});
  }));
  return out;
}

function niceStep(max){const raw=max/4,p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=3?3:n<=4?4:n<=5?5:10)*p}
function barPath(x,y,w,h,r){r=Math.min(r,h,w/2);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function barChart(cfg){
  const wrap=document.getElementById('chartwrap');if(!wrap)return;
  const W=Math.max(300,wrap.clientWidth),H=320,ml=46,mr=8,mt=14,mb=32,ns=cfg.series.length;
  const pw=W-ml-mr,ph=H-mt-mb;
  const mx=Math.max(0,...cfg.series.flatMap(s=>s.vals)),max=mx>0?mx:(cfg.empty||1);
  const step=niceStep(max),top=step*Math.ceil(max/step),yy=v=>mt+ph-(v/top)*ph;
  let g='';
  for(let v=0;v<=top+1;v+=step){
    g+=`<line x1="${ml}" x2="${W-mr}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line)" ${v?'stroke-dasharray="4 4"':''}/>`;
    g+=`<text class="ax" x="${ml-8}" y="${yy(v)+4}" text-anchor="end">${cfg.tick(v)}</text>`;
  }
  const gw=pw/cfg.cats.length,bw=Math.min(64,gw*0.8/ns-2);
  cfg.cats.forEach((c,i)=>{
    const cx=ml+gw*i+gw/2;
    cfg.series.forEach((s,si)=>{
      const v=s.vals[i],h=(v/top)*ph,x=cx-(ns*bw+(ns-1)*3)/2+si*(bw+3);
      if(h>0)g+=`<path d="${barPath(x,yy(v),bw,h,4)}" fill="${s.color}"><title>${esc(String(c).replace('\n',' '))} · ${esc(s.name)} : ${cfg.val(v)}</title></path>`;
    });
    const ls=String(c).split('\n'),fs=W<520?10:12;
    g+=`<text class="ax" text-anchor="middle" style="font-size:${fs}px">${ls.map((t,j)=>`<tspan x="${cx}" y="${H-10-(ls.length-1)*14+j*14}">${esc(t)}</tspan>`).join('')}</text>`;
  });
  wrap.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.label)}">${g}</svg>
  <div class="legend">${cfg.series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}

function monthLines(id){

  for(let m=1;m<=last;m++){

    cur.forEach((l,key)=>{const v=l.m-(prev.get(key)||0);if(v)out.push({...l,date:eom(m),m:v})});

  return String(t).replace(/[   ]/g,' ').split('').map(ch=>{const c=ch.charCodeAt(0);const b=M[ch]!==undefined?M[ch]:(c<256?c:63);const x=String.fromCharCode(b);return (x==='('||x===')'||x==='\\')?'\\'+x:x}).join('')};

async function saveBytes(bytes,type,name){
  const blob=new Blob([bytes],{type});
  try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:name,data:blob});return}}}catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

    else if(c==='"')q=true;else if(c===dl){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}

  for(let k=0;k<n&&dv.getUint32(p,true)===0x02014b50;k++){
    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    files[new TextDecoder().decode(u8.subarray(p+46,p+46+nl))]={method,csz,lo};p+=46+nl+el+cl}
  return {names:Object.keys(files),get:async name=>{const f=files[name];if(!f)return null;
    const lo=f.lo,st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=u8.subarray(st,st+f.csz);
    if(f.method===0)return new TextDecoder().decode(data);

async function readXlsx(buf){

async function readOds(buf){

async function loadImport(file){
  if(!file)return;S.imres=null;

    const buf=await file.arrayBuffer(),u8=new Uint8Array(buf),nm=file.name.toLowerCase();let rows;
    if(u8[0]===0xD0&&u8[1]===0xCF)throw new Error('Le format Excel 97-2003 (.xls) n’est pas lu directement : enregistrez le fichier au format .xlsx ou .csv puis réessayez.');
    if(u8[0]===0x50&&u8[1]===0x4B)rows=nm.endsWith('.ods')?await readOds(buf):await readXlsx(buf);
    else rows=parseCSV(decodeText(buf));

    const wd=Math.max(...rows.map(r=>{let k=r.length;while(k>0&&r[k-1]==='')k--;return k}));rows=rows.map(r=>r.slice(0,wd));
    if(rows.length<2)throw new Error('Le fichier ne contient pas de données (une ligne d’en-têtes puis au moins une ligne).');
    const head=rows[0],map={};let hits=0;
    const kw={n:h=>h.includes('nom')&&!h.includes('prenom'),p:h=>h.includes('prenom'),nai:h=>h.includes('naiss')||h==='dob',ent:h=>/entre|admission|arriv|debutdeprise/.test(h),sor:h=>/sortie|depart|fin(de)?prise/.test(h)};
    const used=new Set();
    IM_FIELDS.forEach(([k,,,alts])=>{let j=head.findIndex((h,x)=>!used.has(x)&&alts.includes(normK(h)));if(j<0)j=head.findIndex((h,x)=>!used.has(x)&&kw[k](normK(h)));map[k]=j;if(j>=0){hits++;used.add(j)}});
    if(hits<2)IM_FIELDS.forEach(([k],j)=>{map[k]=j<head.length?j:-1});
    S.imx={name:file.name,head,rows:rows.slice(1),map,ign:false,fix:{}};
  }catch(err){S.imx=null;toast(err.message||'Fichier illisible',6000)}
  render();
}

function anaData(R){
  const L=l=>l.filter(x=>R.af==='all'||x.f===R.af);
  const pv=L(bySc(R.pv)),rl=L(bySc(R.rl));
  /* Charges : écart = prévu – réalisé ; maîtrisé tant que le réalisé ne dépasse pas le prévu ; alerte dès 90 % du prévu.
     Produits : écart = réalisé – prévu ; conforme sous 2 % d'écart. */
  const rows=ACC(7).concat(ACC(6)).map(c=>{const p=sum(pv,l=>l.k===c.k),r=sum(rl,l=>l.k===c.k);let e,pc,pill,st,bad=false;
    if(c.cl===6){e=p-r;pc=p?e/p*100:0;
      if(r>p){st='Dépassement';pill='<span class="pill neg">Dépassement</span>';bad=true}
      else if(p>0&&r>=p*0.9){st='Alerte';pill='<span class="pill amber">Alerte</span>'}
      else{st='Maîtrisé';pill='<span class="pill pos">Maîtrisé</span>'}}
    else{e=r-p;pc=p?e/p*100:0;
      if(Math.abs(pc)<2){pill='<span class="pill neu">Conforme</span>';st='Conforme'}
      else{bad=e<0;st=bad?'Sous objectif':'Atteint';pill=`<span class="pill ${bad?'neg':'pos'}">${st}</span>`}}
    return {c,p,r,e,pc,bad,pill,st}});
  return {rows,tc:[sum(pv,l=>cls(l.k)===6),sum(rl,l=>cls(l.k)===6)],tp:[sum(pv,l=>cls(l.k)===7),sum(rl,l=>cls(l.k)===7)]};
}

const MLONG=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fmtM=ym=>MLONG[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
const eomYM=ym=>ym+'-'+String(new Date(Date.UTC(+ym.slice(0,4),+ym.slice(5,7),0)).getUTCDate()).padStart(2,'0');
function monthOf(x){
  x=(x||'').trim();let m=x.match(/^(\d{4})-(\d{2})$/);
  if(m&&+m[2]>=1&&+m[2]<=12)return x;
  m=x.match(/^(\d{1,2})\/(\d{4})$/);
  if(m&&+m[1]>=1&&+m[1]<=12)return m[2]+'-'+m[1].padStart(2,'0');
  return null;
}
function parseImport(text){
  const rows=[],err=[],def=monthOf(S.ipp);
  if(!def)return {rows,err:['Période par défaut invalide : choisissez un mois à l’étape 1.']};
  text.split(/\r?\n/).forEach((ln,i)=>{
    if(!ln.trim())return;
    let q=ln.split(/[;\t]/);if(q.length<2)q=ln.split(',');q=q.map(x=>x.trim());
    const k=q[0],m=parseFloat((q[1]||'').replace(/\s/g,'').replace(',','.'));
    if(i===0&&!CM[k]&&isNaN(m))return;
    if(!CM[k])return err.push(`Ligne ${i+1} : compte « ${k} » absent du plan comptable.`);
    if(!isFinite(m)||m<0)return err.push(`Ligne ${i+1} : montant invalide.`);
    const ym=q[2]?monthOf(q[2]):def;
    if(!ym)return err.push(`Ligne ${i+1} : période « ${q[2]} » invalide (AAAA-MM ou MM/AAAA).`);
    if(ym.slice(0,4)!=='2026')return err.push(`Ligne ${i+1} : la période doit être en 2026.`);
    rows.push({k,m,ym,date:eomYM(ym)});
  });
  return {rows,err};
}

function pfDirty(){const el=document.getElementById('pf-dirty');if(el)el.hidden=JSON.stringify(S.pfd)===JSON.stringify(S.pf)}
function onField(e){
  const t=e.target,ds=t.dataset||{};

  if(ds.rp){rpField(t,ds.rp);return}
  if(ds.om){if(ds.om==='m')S.om=t.value;else S.oy=t.value;return}

  if(ds.pf){const[x,y]=ds.pf.split('.');if(y)S.pfd[x][y]=t.value;else S.pfd[x]=t.value;pfDirty();return}
  if(ds.pp){const[i,f]=ds.pp.split('.');S.pfd.payeurs[+i][f]=t.value;pfDirty();return}

    const key=t.id==='ag-logo'?'logos':'slogans',L=S.agpd[key];let bad=0;
    const fs=[...t.files].filter(f=>{if(!/^image\//.test(f.type)||f.size>600000){bad++;return false}return true}).slice(0,Math.max(0,3-L.length));
    if(bad)toast('Image refusée : fichier image de 600 Ko maximum');else if(!fs.length)toast('Trois images au maximum');
    Promise.all(fs.map(f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result));fr.readAsDataURL(f)}))).then(u=>{L.push(...u);render()});return;
  }
  if((t.id==='pf-logo'||t.id==='pf-sign')&&t.files&&t.files[0]){
    const f=t.files[0],key=t.id==='pf-logo'?'logo':'signature';
    if(!/^image\//.test(f.type)){toast('Choisissez un fichier image');return}
    if(f.size>600000){toast('Image trop lourde (600 Ko maximum)');return}
    const fr=new FileReader();fr.onload=()=>{S.pfd[key]=String(fr.result);render()};fr.readAsDataURL(f);return;
  }
  if(t.id==='imx-file'){const f=t.files&&t.files[0];t.value='';loadImport(f);return}
  if(ds.imf){const[i,f]=ds.imf.split('.'),X=S.imx;if(!X)return;X.fix=X.fix||{};
    if(!X.fix[i]){const v=imValidate().find(z=>z.i===+i);X.fix[i]={...v.q}}
    X.fix[i][f]=t.value.trim();render();return}
  if(ds.im){if(ds.im==='ign')S.imx.ign=t.checked;else S.imx.map[ds.im]=+t.value;render();return}
  if(ds.k==='q2'){S.q2=t.value;return}
  if(ds.mf||ds.mr)return;

    const fr=new FileReader();fr.onload=()=>{S.impText=String(fr.result||'');document.getElementById('imptext').value=S.impText};fr.readAsText(t.files[0]);return;
  }
  const k=t.dataset&&t.dataset.k;if(!k)return;
  S[k]=(k==='arr'||k==='pm')?+t.value:k==='jr'?t.value==='1':t.value;S.jn=40;if(k==='af'||k==='pv'||k==='rl'||k==='pm'||k==='jr')S.anaR=null;if(k==='ipc'&&!t.value)S.ips='';
  if(k==='q')jrefresh();
  else render();
}
